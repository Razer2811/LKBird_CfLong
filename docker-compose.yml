
services:
  # =========================
  # MYSQL DATABASE
  # =========================
  mysql:
    image: mysql:8.0
    container_name: lkbird-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - lkbird-data:/var/lib/mysql
    networks:
      - lkbird-network

  # =========================
  # SPRING BOOT BACKEND
  # =========================
  backend:
    image: lkbird-backend:2.0
    container_name: lkbird-backend
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://lkbird-mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - lkbird-uploads:/app/uploads
    networks:
      - lkbird-network

  # =========================
  # REACT FRONTEND
  # =========================
  frontend:
    image: lkbird-frontend:1.0
    container_name: lkbird-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    networks:
      - lkbird-network

# =========================
# EXISTING VOLUMES
# =========================
volumes:
  lkbird-data:
    external: true
    name: lkbird-data

  lkbird-uploads:
    external: true
    name: lkbird-uploads

# =========================
# EXISTING NETWORK
# =========================
networks:
  lkbird-network:
    external: true
    name: lkbird-network
